<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      (() => {
        const repoBase = '/LifaInsure';
        const pathname = window.location.pathname;
        const route = pathname.startsWith(repoBase) ? pathname.slice(repoBase.length) : pathname;
        const normalizedRoute = route === '' ? '/' : route;
        const target = `${repoBase}${normalizedRoute === '/' ? '/' : normalizedRoute}${window.location.search}${window.location.hash}`;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
